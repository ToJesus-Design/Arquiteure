<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Pastofo</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B3A5C">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231B3A5C'/><text y='.9em' font-size='70' x='50%' text-anchor='middle' font-family='Georgia,serif' fill='%23C8860A' font-weight='bold'>P</text></svg>">

  <link rel="stylesheet" href="css/style.css">

  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--bg);
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      color: var(--primary);
      opacity: .08;
      line-height: 1;
      margin-bottom: -2rem;
      letter-spacing: -.04em;
    }
    .error-content { position: relative; z-index: 1; }
    .error-content h1 { font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: .75rem; }
    .error-content p  { color: var(--text-muted); margin-bottom: 2rem; margin-inline: auto; }
    .error-actions    { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
  </style>
</head>
<body>
  <main class="error-page" role="main">
    <div class="error-code" aria-hidden="true">404</div>
    <div class="error-content">
      <span class="eyebrow">Erro 404</span>
      <h1>Página não encontrada</h1>
      <p>A página que procura não existe ou foi movida.<br>Tente uma das opções abaixo.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn--primary">Ir para a homepage</a>
        <a href="produtos.html" class="btn btn--outline-dark">Ver produtos</a>
        <a href="contactos.html" class="btn btn--outline-dark">Contactar</a>
      </div>
    </div>
  </main>
</body>
</html>
